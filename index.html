<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fb" />
    <title>Countly — Simple counters</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="ambient-scene" aria-hidden="true">
      <div class="ambient-orb orb-blue"></div>
      <div class="ambient-orb orb-lilac"></div>
      <div class="ambient-orb orb-peach"></div>
      <div class="glass-noise"></div>
    </div>
    <div class="vehicle-layer" id="vehicle-layer" aria-hidden="true"></div>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="Countly home">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
          <span>countly</span>
        </a>
        <div class="topbar-actions">
          <button class="icon-button hunt-toggle" id="hunt-toggle" type="button" title="Activate Yellow Hunt mode" aria-label="Activate Yellow Hunt mode">
            <span aria-hidden="true">🚕</span>
          </button>
          <div class="language-picker">
            <button class="icon-button language-toggle" id="language-toggle" type="button" title="Choose language" aria-label="Choose language" aria-expanded="false" aria-controls="language-menu">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3c2.3 2.5 3.5 5.5 3.5 9S14.3 18.5 12 21M12 3C9.7 5.5 8.5 8.5 8.5 12s1.2 6.5 3.5 9" /></svg>
            </button>
          </div>
          <button class="icon-button theme-toggle" id="theme-toggle" type="button" title="Switch to dark mode" aria-label="Switch to dark mode">
            <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5" /><path d="M12 2.5v2M12 19.5v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2.5 12h2M19.5 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
            <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.2A8.5 8.5 0 0 1 8.8 4a8.5 8.5 0 1 0 11.2 11.2Z" /></svg>
          </button>
          <button class="icon-button" id="reset-all" type="button" title="Reset all counters" aria-label="Reset all counters">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 5v4h4M4 13a8.1 8.1 0 0 0 15.5 2M20 19v-4h-4" /></svg>
          </button>
        </div>
      </header>

      <section class="hero">
        <div>
          <p class="eyebrow" id="eyebrow" data-i18n="yourCounters">Your counters</p>
          <h1 id="hero-title" data-i18n="heroTitle">Keep track of what matters.</h1>
        </div>
        <button class="add-button" id="add-counter" type="button"><span aria-hidden="true">+</span> <span data-i18n="addCounter">Add counter</span></button>
      </section>

      <section class="hunt-guide" id="hunt-guide" aria-label="How to play Yellow Hunt" hidden>
        <div class="guide-icon" aria-hidden="true">🏁</div>
        <div>
          <p class="guide-title" data-i18n="howToPlay">How to play</p>
          <p class="guide-copy" data-i18n="guideCopy">Spot a yellow car for <strong>1 point</strong>. Log each find and see who can spot the most.</p>
        </div>
      </section>

      <section class="summary" aria-label="Counter summary">
        <div class="summary-item"><span class="summary-value" id="total-count">0</span><span class="summary-label" data-i18n="totalCount">Total count</span></div>
        <div class="summary-divider"></div>
        <div class="summary-item"><span class="summary-value" id="counter-count">0</span><span class="summary-label" data-i18n="activeCounters">Active counters</span></div>
      </section>

      <section class="counter-grid" id="counter-grid" aria-live="polite"></section>

      <p class="hint" id="app-hint"><span class="hint-key">TIP</span> <span data-i18n="renameHint">Click a counter’s name to rename it</span></p>
      <footer><div>Countly <span>•</span> <span data-i18n="keepItSimple">Keep it simple.</span></div><button class="redo-tutorial" id="redo-tutorial" type="button" data-i18n="viewTutorial">View tutorial again</button></footer>
    </main>
    <div class="language-menu" id="language-menu" hidden>
      <p class="language-menu-title" data-i18n="language">Language</p>
      <button type="button" data-language="en">English <span>✓</span></button>
      <button type="button" data-language="de">Deutsch <span></span></button>
      <button type="button" data-language="es">Español <span></span></button>
      <button type="button" data-language="zh">中文 · Mandarin <span></span></button>
      <button type="button" data-language="hi">हिन्दी · Hindi <span></span></button>
    </div>
    <div class="tutorial-overlay" id="tutorial-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="tutorial-title">
      <div class="tutorial-spotlight" id="tutorial-spotlight" aria-hidden="true"></div>
      <div class="tutorial-arrow" id="tutorial-arrow" aria-hidden="true"></div>
      <section class="tutorial-card" id="tutorial-card">
        <div class="tutorial-kicker"><span data-i18n="quickTour">QUICK TOUR</span> <span id="tutorial-step">1 / 6</span></div>
        <h2 id="tutorial-title"></h2>
        <p id="tutorial-copy"></p>
        <div class="tutorial-actions">
          <button class="skip-tutorial" id="skip-tutorial" type="button" data-i18n="skipIntro">Skip intro</button>
          <button class="continue-tutorial" id="continue-tutorial" type="button"><span data-i18n="continue">Continue</span> <span aria-hidden="true">→</span></button>
        </div>
      </section>
    </div>
    <script src="app.js"></script>
  </body>
</html>
